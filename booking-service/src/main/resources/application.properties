spring.application.name=booking-service
server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILE:dev}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.public-base-path=${PUBLIC_BASE_PATH:/api/booking}
app.time-zone=${APP_TIME_ZONE:Asia/Bahrain}
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION}
spring.datasource.url=${BOOKING_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${BOOKING_DB_USERNAME:medic_booking}
spring.datasource.password=${BOOKING_DB_PASSWORD:medic_booking}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.identity.url=${IDENTITY_URL:http://localhost:8082}
app.internal-api-key=${INTERNAL_API_KEY:change-me}
springdoc.swagger-ui.persist-authorization=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.schedule-cache.enabled=true
spring.web.error.include-stacktrace=never
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.com.ga.medic=WARN
app.outbox.enabled=true
app.outbox.publisher-enabled=true
app.outbox.publish-interval-ms=5000
app.outbox.max-attempts=10
app.processed-event.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
springdoc.show-actuator=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.devtools.restart.enabled=false
spring.sql.init.mode=never
