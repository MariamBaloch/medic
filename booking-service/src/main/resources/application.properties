# Service identity and HTTP port
spring.application.name=booking-service
server.port=${SERVER_PORT:8081}
# Public links and the timezone used for appointments
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.public-base-path=${PUBLIC_BASE_PATH:/api/booking}
app.time-zone=${APP_TIME_ZONE:Asia/Bahrain}
# JWT validation
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION:3600000}
# Identity service used for live profiles and the shared internal API key
app.identity.url=${IDENTITY_URL:http://localhost:8082}
app.internal-api-key=${INTERNAL_API_KEY}
# Postgres connection and the booking schema
spring.datasource.url=${BOOKING_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${BOOKING_DB_USERNAME:medic_booking}
spring.datasource.password=${BOOKING_DB_PASSWORD:medic_booking}
spring.datasource.hikari.connection-init-sql=SET search_path TO booking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.health.mail.enabled=false
spring.jpa.properties.hibernate.default_schema=booking
spring.flyway.schemas=booking
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.sql.init.mode=never
# Redis schedule-cache version
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.schedule-cache.enabled=true
# Kafka producer and consumer for booking and identity events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Outbox publisher and idempotent inbound-event tracking
app.outbox.enabled=true
app.outbox.publisher-enabled=true
app.outbox.publish-interval-ms=5000
app.outbox.max-attempts=10
app.processed-event.enabled=true
# Logs, health, and API docs.
spring.web.error.include-stacktrace=never
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.com.ga.medic=WARN
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
springdoc.swagger-ui.persist-authorization=true
springdoc.show-actuator=true
spring.devtools.restart.enabled=false
