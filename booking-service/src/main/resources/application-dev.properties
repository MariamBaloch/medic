spring.datasource.url=${BOOKING_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${BOOKING_DB_USERNAME:medic_booking}
spring.datasource.password=${BOOKING_DB_PASSWORD:medic_booking}
spring.datasource.hikari.connection-init-sql=SET search_path TO booking
spring.web.error.include-stacktrace=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=booking
spring.flyway.schemas=booking
spring.flyway.default-schema=booking
spring.flyway.create-schemas=true
logging.level.root=INFO
logging.level.com.ga.medic=DEBUG
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

