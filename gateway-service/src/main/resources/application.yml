server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  http:
    clients:
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:5s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:0}
  cloud:
    gateway:
      server:
        webmvc:
          streaming-media-types:
            - text/event-stream
            - application/stream+json
          routes:
            - id: monolith
              uri: ${MONOLITH_URL:http://localhost:8081}
              predicates:
                - Path=/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    com.ga.medic.gateway: INFO
