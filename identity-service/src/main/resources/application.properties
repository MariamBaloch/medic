# Service identity and HTTP port
spring.application.name=identity-service
server.port=${SERVER_PORT:8082}
# Public API URL used in verification links
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.public-base-path=${PUBLIC_BASE_PATH:/api/identity}
app.frontend-url=http://localhost:5173
# JWT signing. Required in every environment
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION:3600000}
# Shared secret for /internal/** calls from other services
app.internal-api-key=${INTERNAL_API_KEY}
# Postgres connection and the identity schema
spring.datasource.url=${IDENTITY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${IDENTITY_DB_USERNAME:medic_identity}
spring.datasource.password=${IDENTITY_DB_PASSWORD:medic_identity}
spring.datasource.hikari.connection-init-sql=SET search_path TO identity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=identity
spring.flyway.schemas=identity
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.sql.init.mode=never
# Redis token blacklist and token version
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Kafka producer for identity change events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Transactional outbox that publishes those Kafka events
app.outbox.enabled=true
app.outbox.publisher-enabled=true
app.outbox.publish-interval-ms=5000
app.outbox.max-attempts=10
# SMTP - Local default is Mailpit
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Directory where uploaded avatars are stored
app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}
# Health endpoint and correlation id on log lines
logging.pattern.level=%5p [%X{correlationId:-}]
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
springdoc.swagger-ui.persist-authorization=true
