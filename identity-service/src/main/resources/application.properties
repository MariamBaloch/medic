spring.application.name=identity-service
server.port=${SERVER_PORT:8082}
spring.profiles.active=${SPRING_PROFILE:dev}
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION:3600000}
spring.datasource.url=${IDENTITY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${IDENTITY_DB_USERNAME:medic_identity}
spring.datasource.password=${IDENTITY_DB_PASSWORD:medic_identity}
spring.datasource.hikari.connection-init-sql=SET search_path TO identity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=identity
spring.flyway.enabled=true
spring.flyway.schemas=identity
spring.flyway.default-schema=identity
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}
app.internal-api-key=${INTERNAL_API_KEY:change-me}
logging.pattern.level=%5p [%X{correlationId:-}]
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
springdoc.swagger-ui.persist-authorization=true
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.outbox.publisher-enabled=true
app.outbox.publish-interval-ms=5000
app.outbox.max-attempts=10
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
