spring.application.name=medic-monolith
server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILE:dev}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.time-zone=${APP_TIME_ZONE:Asia/Bahrain}
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.upload.base-dir=uploads
springdoc.swagger-ui.persist-authorization=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
app.schedule-cache.enabled=true
spring.web.error.include-stacktrace=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
logging.pattern.level=%5p [%X{correlationId:-}]
logging.level.com.ga.medic=WARN
app.outbox.publisher-enabled=true
app.outbox.publish-interval-ms=5000
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
springdoc.show-actuator=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.devtools.restart.enabled=false
spring.sql.init.mode=always
