# Service identity and HTTP port
spring.application.name=audit-service
server.port=${SERVER_PORT:8085}
# JWT validation
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION:3600000}
# Shared secret for /internal/** calls
app.internal-api-key=${INTERNAL_API_KEY}
# Postgres connection and the audit schema
spring.datasource.url=${AUDIT_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${AUDIT_DB_USERNAME:medic_audit}
spring.datasource.password=${AUDIT_DB_PASSWORD:medic_audit}
spring.datasource.hikari.connection-init-sql=SET search_path TO audit
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=audit
spring.flyway.schemas=audit
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Kafka consumer for audit events
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# How long processed Kafka event ids are kept
app.processed-event.enabled=true
app.processed-event.retention-days=14
app.processed-event.retention-cron=0 15 3 * * *
# Health endpoint and correlation id on log lines
logging.pattern.level=%5p [%X{correlationId:-}]
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
springdoc.swagger-ui.persist-authorization=true
