spring.datasource.url=${AUDIT_DB_URL}
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.ga.medic=INFO
