spring.application.name=notification-service
server.port=${SERVER_PORT:8084}
spring.profiles.active=${SPRING_PROFILE:dev}
jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION:3600000}
spring.datasource.url=${NOTIFICATION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/medic}}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:medic_notification}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:medic_notification}
spring.datasource.hikari.connection-init-sql=SET search_path TO notification
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notification
spring.flyway.enabled=true
spring.flyway.schemas=notification
spring.flyway.default-schema=notification
spring.flyway.create-schemas=true
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Dev default: Mailpit
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
logging.pattern.level=%5p [%X{correlationId:-}]
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
springdoc.swagger-ui.persist-authorization=true
app.internal-api-key=${INTERNAL_API_KEY:change-me}
app.processed-event.enabled=true
app.processed-event.retention-days=14
app.processed-event.retention-cron=0 15 3 * * *
