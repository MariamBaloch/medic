<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title}">Notification</title>
</head>

<body style="
    margin:0;
    padding:0;
    background-color:#f4f8f6;
    font-family:Arial, Helvetica, sans-serif;
    color:#1f2937;
">

<table
        border="0"
        cellpadding="0"
        cellspacing="0"
        role="presentation"
        style="
        width:100%;
        background-color:#f4f8f6;
        padding:40px 16px;
    "
        width="100%"
>
    <tr>
        <td align="center">

            <!-- Main Container -->
            <table
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                    role="presentation"
                    style="
                    width:100%;
                    max-width:600px;
                    background:#ffffff;
                    border-radius:12px;
                    overflow:hidden;
                    border:1px solid #dce8e3;
                "
                    width="100%"
            >

                <!-- Header -->
                <tr>
                    <td
                            style="
                            background:#047857;
                            padding:28px 32px;
                            text-align:left;
                        "
                    >
                        <div
                                style="
                                font-size:13px;
                                font-weight:bold;
                                letter-spacing:1.5px;
                                text-transform:uppercase;
                                color:#d1fae5;
                                margin-bottom:10px;
                            "
                        >
                            Medic
                        </div>

                        <h1
                                style="
                                margin:0;
                                font-size:26px;
                                line-height:1.3;
                                font-weight:600;
                                color:#ffffff;
                            "
                                th:text="${title}"
                        >
                            Notification title
                        </h1>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td
                            style="
                            padding:36px 32px 32px;
                        "
                    >

                        <!-- Greeting -->
                        <p
                                style="
                                margin:0 0 22px;
                                font-size:16px;
                                line-height:1.6;
                                color:#374151;
                            "
                        >
                            Hi
                            <strong
                                    style="color:#111827;"
                                    th:text="${fullName}"
                            >
                                User
                            </strong>,
                        </p>

                        <!-- Message Card -->
                        <table
                                border="0"
                                cellpadding="0"
                                cellspacing="0"
                                role="presentation"
                                style="
                                width:100%;
                                background:#f0fdf4;
                                border:1px solid #d1fae5;
                                border-left:4px solid #059669;
                                border-radius:10px;
                            "
                                width="100%"
                        >
                            <tr>
                                <td style="padding:20px 22px;">

                                    <p
                                            style="
                                            margin:0;
                                            font-size:15px;
                                            line-height:1.7;
                                            color:#374151;
                                        "
                                            th:text="${message}"
                                    >
                                        Notification message
                                    </p>

                                </td>
                            </tr>
                        </table>

                        <!-- Spacing -->
                        <div style="height:28px; line-height:28px;">
                            &nbsp;
                        </div>

                        <!-- Automated Message -->
                        <p
                                style="
                                margin:0;
                                font-size:13px;
                                line-height:1.6;
                                color:#9ca3af;
                            "
                        >
                            This is an automated notification from Medic.
                            Please do not reply to this email.
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td
                            style="
                            padding:18px 32px;
                            background:#f8faf9;
                            border-top:1px solid #e5ebe8;
                            text-align:center;
                        "
                    >
                        <p
                                style="
                                margin:0;
                                font-size:12px;
                                line-height:1.5;
                                color:#9ca3af;
                            "
                        >
                            © Medic · Healthcare made simpler
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
